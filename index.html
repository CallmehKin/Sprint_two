<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EV ChargeOps — Sprint 02</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#101827;color:#eef2f7} header{padding:24px 6%;background:#16243a}
h1{margin:0 0 6px} main{padding:24px 6%;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#1b2a41;padding:18px;border-radius:12px}.value{font-size:28px;font-weight:bold}
button{background:#3b82f6;color:white;border:0;padding:10px 14px;border-radius:8px;cursor:pointer;margin:4px}
pre{background:#0b1220;padding:14px;border-radius:10px;overflow:auto}table{width:100%;border-collapse:collapse;background:#1b2a41}th,td{padding:9px;border-bottom:1px solid #31435e;text-align:left}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
</style></head>
<body><header><h1>EV ChargeOps</h1><div>Sprint 02 — protótipo funcional</div></header>
<main>
<div class="grid" id="cards"></div>
<div style="margin:18px 0"><button onclick="treinar()">Treinar módulo de IA</button><button onclick="diagnostico()">Executar diagnóstico</button><button onclick="prever()">Prever consumo</button><button onclick="location.reload()">Atualizar</button></div>
<div class="card"><h2>Resultado da IA</h2><pre id="ia">Clique em uma ação.</pre></div>
<h2>Sessões registradas</h2><table><thead><tr><th>ID</th><th>Usuário</th><th>Carregador</th><th>Energia</th><th>Custo</th></tr></thead><tbody id="sessoes"></tbody></table>
</main>
<script>
async function api(u,o){let r=await fetch(u,o);return r.json()}
async function load(){let x=await api('/api/resumo');cards.innerHTML=`<div class=card><div>Sessões</div><div class=value>${x.sessoes}</div></div><div class=card><div>Energia</div><div class=value>${x.energia_kwh} kWh</div></div><div class=card><div>Faturamento</div><div class=value>R$ ${x.faturamento.toFixed(2)}</div></div><div class=card><div>Média/sessão</div><div class=value>${x.media_kwh_sessao} kWh</div></div>`;
let s=await api('/api/sessoes');sessoes.innerHTML=s.map(a=>`<tr><td>${a.id}</td><td>${a.usuario}</td><td>${a.carregador}</td><td>${a.energia_kwh} kWh</td><td>R$ ${a.custo_total.toFixed(2)}</td></tr>`).join('')}
async function treinar(){ia.textContent=JSON.stringify(await api('/api/ia/treinar'),null,2)}
async function diagnostico(){ia.textContent=JSON.stringify(await api('/api/ia/diagnostico'),null,2)}
async function prever(){ia.textContent=JSON.stringify(await api('/api/ia/prever?hora=18&duracao_min=90&tarifa_kwh=0.89'),null,2)}
load()
</script></body></html>
